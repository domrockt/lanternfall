<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#06070c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Lanternfall</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #06070c;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      /* iOS: Inhalt nicht unter Notch/Home-Indikator legen. */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      display: block;
    }
    #lf-rotate {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #06070c;
      color: #f3e6b6;
      font-family: ui-monospace, monospace;
      text-align: center;
      padding: 24px;
      z-index: 1000;
      touch-action: none;
    }
    #lf-rotate.visible { display: flex; }
    #lf-rotate .phone {
      width: 54px;
      height: 92px;
      border: 4px solid #f3e6b6;
      border-radius: 8px;
      animation: lf-tilt 1.6s ease-in-out infinite;
    }
    #lf-rotate .title { font-size: 20px; letter-spacing: 2px; }
    #lf-rotate .hint { font-size: 13px; color: #b9b0a0; }
    @keyframes lf-tilt {
      0%, 40% { transform: rotate(0deg); }
      70%, 100% { transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <div id="lf-rotate" aria-hidden="true">
    <div class="phone"></div>
    <div class="title">GERÄT DREHEN</div>
    <div class="hint">LANTERNFALL SPIELT IM QUERFORMAT · DAS SPIEL IST PAUSIERT</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
